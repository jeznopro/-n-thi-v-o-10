<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Hệ thống Tự luận Toán THCS</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/toast.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);
    }
    .login-box {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      padding: 36px 32px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      margin: 0 auto 16px;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
    }
    .login-header h2 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0f172a;
    }
    .login-header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <div class="login-logo">∑</div>
        <h2>HỆ THỐNG TỰ LUẬN TOÁN THCS</h2>
        <p>Cổng đăng nhập dành cho Giáo viên & Học sinh</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Tên đăng nhập <span class="req">*</span></label>
          <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập của bạn..." required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu <span class="req">*</span></label>
          <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu..." required autocomplete="current-password">
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; margin-top: 8px;">
          Đăng Nhập
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Kiểm tra thông báo phiên hết hạn từ URL
    if (new URLSearchParams(window.location.search).get('expired')) {
      showToast('Phiên làm việc đã hết hạn. Vui lòng đăng nhập lại.', 'warning');
    }

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('btn-submit');

    form.onsubmit = async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang xử lý đăng nhập...';

      try {
        const res = await apiRequest('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });

        localStorage.setItem('token', res.token);
        localStorage.setItem('user', JSON.stringify(res.user));

        showToast('Đăng nhập thành công! Đang chuyển hướng...', 'success');

        setTimeout(() => {
          if (res.user.must_change_password === 1) {
            window.location.href = '/change-password.html';
          } else if (res.user.role === 'teacher') {
            window.location.href = '/teacher/index.html';
          } else {
            window.location.href = '/student/index.html';
          }
        }, 800);
      } catch (err) {
        showToast(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Đăng Nhập';
      }
    };
  </script>
</body>
</html>
