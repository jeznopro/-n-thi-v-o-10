<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi mật khẩu - Hệ thống Tự luận Toán THCS</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/toast.css">
  <style>
    .change-pwd-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #f1f5f9;
    }
    .change-pwd-box {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 36px 32px;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <div class="change-pwd-container">
    <div class="change-pwd-box">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 50px; height: 50px; background: #fef3c7; color: #d97706; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 12px;">🔒</div>
        <h2 style="font-size: 1.35rem; color: #0f172a;">ĐỔI MẬT KHẨU TÀI KHOẢN</h2>
        <p style="font-size: 0.875rem; color: #64748b; margin-top: 6px;">
          Để đảm bảo tính an toàn và bảo mật, hệ thống yêu cầu bạn thay đổi mật khẩu mặc định trước khi tiếp tục.
        </p>
      </div>

      <form id="change-pwd-form">
        <div class="form-group">
          <label class="form-label" for="current-pwd">Mật khẩu hiện tại <span class="req">*</span></label>
          <input type="password" id="current-pwd" class="form-control" placeholder="Nhập mật khẩu hiện tại..." required>
        </div>

        <div class="form-group">
          <label class="form-label" for="new-pwd">Mật khẩu mới (tối thiểu 6 ký tự) <span class="req">*</span></label>
          <input type="password" id="new-pwd" class="form-control" placeholder="Nhập mật khẩu mới..." required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-pwd">Xác nhận mật khẩu mới <span class="req">*</span></label>
          <input type="password" id="confirm-pwd" class="form-control" placeholder="Nhập lại mật khẩu mới..." required minlength="6">
        </div>

        <button type="submit" id="btn-change" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem;">
          Cập Nhật Mật Khẩu Mới
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('change-pwd-form');
    const btn = document.getElementById('btn-change');

    form.onsubmit = async (e) => {
      e.preventDefault();
      const current_password = document.getElementById('current-pwd').value;
      const new_password = document.getElementById('new-pwd').value;
      const confirm_password = document.getElementById('confirm-pwd').value;

      if (new_password !== confirm_password) {
        showToast('Mật khẩu mới và mật khẩu xác nhận không trùng khớp!', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Đang cập nhật...';

      try {
        await apiRequest('/api/auth/change-password', {
          method: 'POST',
          body: JSON.stringify({ current_password, new_password })
        });

        showToast('Đổi mật khẩu thành công! Đang chuyển vào hệ thống...', 'success');

        // Lấy lại thông tin user để định tuyến
        const me = await apiRequest('/api/auth/me');
        setTimeout(() => {
          if (me.user.role === 'teacher') {
            window.location.href = '/teacher/index.html';
          } else {
            window.location.href = '/student/index.html';
          }
        }, 1000);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Cập Nhật Mật Khẩu Mới';
      }
    };
  </script>
</body>
</html>
